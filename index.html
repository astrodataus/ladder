<style>
/* Layout: a guided certificate. Masthead with the Treasury close, a numbered rail of six steps,
   then a narrow guide column (words + controls) beside one engraved stage (the picture). */
:root{
  /* security paper and intaglio ink */
  --paper:#ECEFE6; --paper-2:#E1E6DA; --ink:#13302A; --ink-2:#435950; --ink-3:#6C7F76;
  --rule:#C3CCBD; --rule-2:#D5DBCF;
  /* seal red: today, you, the thing selected */
  --seal:#B3382A;
  /* goal tiers, one hue light to dark (validated ordinal ramp) */
  --t1:#1C4F42; --t2:#3F8068; --t3:#7AAB92;
  --ss:#AEB8B0;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1A17; --paper-2:#15241F; --ink:#E2E9DE; --ink-2:#A7B6AD; --ink-3:#7A8C83;
  --rule:#2C3D37; --rule-2:#1F2F2A; --seal:#F07A62;
  --t1:#B5DCC8; --t2:#6FAD93; --t3:#3C7C66; --ss:#4E5C56; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1A17; --paper-2:#15241F; --ink:#E2E9DE; --ink-2:#A7B6AD; --ink-3:#7A8C83;
  --rule:#2C3D37; --rule-2:#1F2F2A; --seal:#F07A62;
  --t1:#B5DCC8; --t2:#6FAD93; --t3:#3C7C66; --ss:#4E5C56; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:16px/1.55 var(--sans);font-feature-settings:"kern";-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* masthead */
.mast{border-bottom:1px solid var(--rule)}
.mast .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-block:22px 16px}
.brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.word{font-family:var(--display);font-size:40px;line-height:1;font-weight:800;font-stretch:72%;letter-spacing:-.015em}
.sub{color:var(--ink-2);font-size:15px}
.close{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.close b{color:var(--ink);font-weight:600}
.close .k{color:var(--ink-3)}
.close .today b{font-weight:700}
.theme{background:none;border:1px solid var(--rule);width:32px;height:32px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.theme svg{width:16px;height:16px}

/* rail */
.rail{border-bottom:1px solid var(--rule)}
.rail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr)}
.rail button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:baseline;width:100%;padding:12px 12px 12px 0;cursor:pointer;color:var(--ink-3);border-top:2px solid transparent;margin-top:-1px}
.rail button .n{font-family:var(--display);font-size:20px;line-height:1;font-weight:700;font-stretch:75%;font-variant-numeric:lining-nums}
.rail button .l{font-size:14px}
.rail button:hover{color:var(--ink-2)}
.rail button[aria-current="step"]{color:var(--ink);border-top-color:var(--seal)}
.rail button.done .n{color:var(--ink-2)}

/* desk */
.desk{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:40px;padding-block:28px 40px}
.guide{min-width:0}
.stage{min-width:0;position:relative}
.stepno{color:var(--ink-3);font-size:13px;margin:0 0 6px}
.guide h2{font-family:var(--display);font-weight:700;font-stretch:75%;font-size:38px;line-height:1.04;margin:0 0 14px;text-wrap:balance;letter-spacing:-.012em}
.lead{font-family:var(--sans);font-size:19px;line-height:1.45;margin:0 0 14px;text-wrap:pretty}
.lead b,.lead strong{font-weight:600}
.lead .you{color:var(--seal)}
.guide p{margin:0 0 12px;max-width:62ch}
.guide p.small{font-size:14px;color:var(--ink-2)}
.facts{list-style:none;margin:16px 0;padding:0;border-top:1px solid var(--rule)}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:14px}
.facts li span:first-child{color:var(--ink-2)}
.facts li span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.navbtns{display:flex;gap:10px;margin:22px 0 18px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:none;padding:9px 16px;cursor:pointer;font-size:15px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--paper-2)}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
details.how{border-top:1px solid var(--rule);padding-top:10px;font-size:14px;color:var(--ink-2)}
details.how summary{cursor:pointer;color:var(--ink);font-weight:500}
details.how p{margin:8px 0 0}
.note{font-size:13px;color:var(--ink-2);border-left:2px solid var(--seal);padding:2px 0 2px 10px;margin:0 0 16px}

/* controls */
fieldset{border:0;border-top:1px solid var(--rule);margin:0;padding:12px 0 4px}
legend{font-family:var(--display);font-size:19px;padding:0 0 4px;font-weight:700;font-stretch:75%}
.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:6px 0}
.ctl label{font-size:14px;color:var(--ink-2)}
.ctl output,.ctl .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;text-align:right}
.ctl input[type=range]{grid-column:1/-1}
.money{display:flex;align-items:center;border-bottom:1px solid var(--ink-3);min-width:0}
.money span{color:var(--ink-3);font-size:14px;padding-right:2px}
.money input{border:0;background:none;width:9ch;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:3px 0;-moz-appearance:textfield}
.money input::-webkit-outer-spin-button,.money input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money input:focus{outline:none}
.money:focus-within{border-bottom-color:var(--seal)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink-3)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);margin-top:-7px;cursor:grab}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);cursor:grab}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{border-color:var(--seal)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.seg button{border:1px solid var(--rule);background:none;padding:4px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* stage */
.panel{margin:0 0 26px}
.panel h3{font-family:var(--display);font-weight:700;font-stretch:75%;font-size:22px;line-height:1.15;margin:0 0 4px;letter-spacing:-.005em}
.panel .cap{font-size:14px;color:var(--ink-2);margin:0 0 10px;max-width:72ch}
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
svg text{font-family:var(--sans);fill:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums}
svg .tick{fill:var(--ink-3);font-size:10.5px}
svg .val{fill:var(--ink);font-weight:600}
svg .big{font-family:var(--display);font-weight:700;font-stretch:75%;fill:var(--ink);font-size:26px;font-variant-numeric:lining-nums proportional-nums}
svg .seal{fill:var(--seal)}
svg .grid{stroke:var(--rule-2);stroke-width:1}
svg .axis{stroke:var(--rule);stroke-width:1}
svg .hair{stroke:var(--ink-3);stroke-width:1}

  led.innerHTML = rows.map(([n, t, c, s, m]) => `<div class="goal"><div><h4><span class="sw" style="background:${c}"></span>${n}</h4><div class="tier">${t}</div></div><div><p class="status">${s}</p><ul>${m.map(x => `<li>${x}</li>`).join("")}</ul></div></div>`).join("");

  const p2 = panel("Your ladder, one coupon per year", "Old bearer bonds came with a sheet of coupons, one to clip each year. These are yours: the essentials each year of the ladder pays, in today’s dollars. Dashed coupons are years not yet locked.");
  const cp = document.createElement("div"); cp.className = "coupons"; p2.appendChild(cp);
  const unf = Math.max(0, 1 - fundEss);
  cp.innerHTML = ages().filter(a => a >= H.retire).map(a => {
    const n = needs(a), locked = a < H.lockTo && n.ess > 0;
    return `<div class="coupon ${locked ? "" : "open"}"><div class="a">${a}</div><div class="y">${THIS_YEAR + (a - H.age)}</div><div class="m">${money(n.ess / 12 * (locked ? 1 - unf : 1), { round: 10 })}/mo</div></div>`;
  }).join("");
}
function guidePlan() {
  const P = prices(), B = rates(replay(), "B");
  const dur = (prices(shifted(-0.1)).locked - P.locked);
  return `
  <p class="lead">Three goals, in order. Lock what you must have. Invest what you want. Let the wish take the risk.</p>
  <p>Your floor is priced at <b>${money(P.locked, { round: 100 })}</b> at the Treasury close of ${dateLong(F.asof)}. It moves about <b>${money(dur, { round: 100 })}</b> for every 0.1 point real yields fall.</p>
  <ul class="facts">
    <li><span>10-year real yield today</span><span>${F.real10.toFixed(2)}%</span></li>
    <li><span>Essentials funded at bond prices</span><span>${Math.min(100, Math.round(P.res / Math.max(1, P.locked) * 100))}%</span></li>
    <li><span>Lifestyle held, floor plan</span><span>${B.lifeOK} of ${B.n}</span></li>
  </ul>
  <p class="small">This is an educational model, not advice. It ignores taxes, fees and account types, and history does not repeat on schedule. Bring it to a fee-only planner as a starting point.</p>

}
const howPlan = `<p>Essentials moves solve for the saving or retirement age at which your resources cover the floor at today’s real yields. Lifestyle moves search for the smallest change that keeps lifestyle uncut in at least 90% of historical start years under the floor plan. Coupons show the essentials Social Security does not cover; if the floor is not fully funded, locked coupons are scaled to the share you can buy.</p>`;

/* ===================== shell ===================== */
const GUIDES = [guideMarket, guidePrice, guideGoals, guideFloor, guideStress, guidePlan];
const HOWS = [howMarket, howPrice, howGoals, howFloor, () => howStress.replace("${H.plan}", H.plan), howPlan];
const RENDERS = [renderMarket, renderPrice, renderGoals, renderFloor, renderStress, renderPlan];
const TITLES = ["What bonds pay today", "The price of a year", "Your goals", "Lock the floor", "Stress test", "Your plan"];
function renderRail() {
  $("#rail").innerHTML = STEPS.map((s, i) => `<li><button type="button" data-i="${i}" ${i === st.step ? 'aria-current="step"' : ""} class="${st.visited.has(i) && i !== st.step ? "done" : ""}"><span class="n">${i + 1}</span><span class="l">${s.label}</span></button></li>`).join("");
  $("#rail").querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.i));
}
function renderGuide() {
  const i = st.step, how = typeof HOWS[i] === "function" ? HOWS[i]() : HOWS[i];
  $("#guide").innerHTML = `<p class="stepno">Step ${i + 1} of 6</p><h2>${TITLES[i]}</h2>${GUIDES[i]()}
    <div class="navbtns">${i > 0 ? `<button class="btn" type="button" id="prev">Back</button>` : ""}${i === 5 ? `<button class="btn primary" type="button" id="edit-goals">Change your goals</button>` : ""}${i < 5 ? `<button class="btn primary" type="button" id="next">Next: ${STEPS[i + 1].label.replace(/^The /, "the ").replace(/^./, c => c.toUpperCase())}</button>` : ""}</div>
    <details class="how"><summary>How this is computed</summary>${how}</details>`;
  $("#prev") && ($("#prev").onclick = () => go(i - 1));
  $("#next") && ($("#next").onclick = () => go(i + 1));
  $("#edit-goals") && ($("#edit-goals").onclick = () => go(2));
  if (i === 2) wireInputs();
}
function renderStage() { hideTip(); $("#stage").innerHTML = ""; RENDERS[st.step](); }
function refreshGuideText() {
  if (st.step === 2) { const l = $("#goals-lead"); if (l) l.innerHTML = goalsLead(); return; }
  const open = $("#guide details.how")?.open; const f = document.activeElement?.id;
  renderGuide(); if (open) $("#guide details.how").open = true; if (f && $("#" + f)) $("#" + f).focus();
}
let raf = 0;
function rerender(keepFocus) {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const ae = document.activeElement, label = ae && ae.getAttribute && ae.getAttribute("aria-label");
    if (st.step === 2 && $("#goals-chart")) { hideTip(); $("#goals-chart").innerHTML = ""; yearsChart($("#goals-chart")); goalsDerived(); } else renderStage();
    refreshGuideText();
    if (keepFocus && label) { const n = $("#stage").querySelector(`[aria-label="${label}"]`); n && n.focus(); }
  });
}
function go(i) { st.step = clamp(i, 0, 5); st.visited.add(st.step); renderRail(); renderGuide(); renderStage(); if (!SANDBOX) { try { history.replaceState(null, "", "#" + STEPS[st.step].id); } catch (e) {} } window.scrollTo({ top: 0, behavior: "smooth" }); }
function normalize() {
  H.age = clamp(H.age, 30, 75); H.plan = clamp(H.plan, Math.max(80, H.age + 10), 100);
  H.retire = clamp(H.retire, H.age, Math.min(80, H.plan - 2)); H.claim = clamp(H.claim, 62, 70);
  H.lockTo = clamp(H.lockTo, H.retire, H.plan); H.stock = clamp(H.stock, 0, 100);
  ["savings", "contrib", "ss", "ess", "life", "legacy"].forEach(k => { H[k] = Math.max(0, Number(H[k]) || 0); });
}
function syncInputs() {
  document.querySelectorAll("[data-k]").forEach(inp => { if (document.activeElement === inp && inp.dataset.money) return; inp.value = inp.dataset.money ? fmtNum(H[inp.dataset.k]) : H[inp.dataset.k]; const o = $("#" + inp.id + "-o"); if (o) o.textContent = H[inp.dataset.k] + (inp.dataset.u || ""); });
  const l = $("#goals-lead"); if (l) l.innerHTML = goalsLead();
}
function wireInputs(root = $("#guide")) {
  const wasAll = () => H.lockTo >= H.plan;
  root.querySelectorAll("[data-k]").forEach(inp => {
    inp.addEventListener("input", () => {
      const k = inp.dataset.k, all = wasAll(); const raw = inp.dataset.money ? inp.value.replace(/[^\d]/g, "") : inp.value; const v = Number(raw); if (raw === "" || isNaN(v)) return;
      H[k] = v; if (all) H.lockTo = H.plan; normalize(); if (all) H.lockTo = H.plan;
      const o = $("#" + inp.id + "-o"); if (o) o.textContent = H[k] + (inp.dataset.u || "");
      syncInputs(); rerender();
    });
    if (inp.dataset.money) inp.addEventListener("blur", () => { inp.value = fmtNum(H[inp.dataset.k]); });
  });
  if (root.id !== "guide") return;
  $("#reset").onclick = () => { Object.assign(H, EXAMPLE); syncInputs(); rerender(); };
  $("#goals-lead").innerHTML = goalsLead();
}
function renderChrome() {
  $("#close").innerHTML = `<span class="today"><b>${new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</b></span><span><span class="k">Prices from the</span> <b>${dateLong(F.asof).replace(/, \d{4}$/, "")}</b> <span class="k">close</span></span><span><span class="k">10-year</span> <b>${F.nom10.toFixed(2)}%</b></span><span><span class="k">10-year real</span> <b>${F.real10.toFixed(2)}%</b></span><span><span class="k">Inflation expected</span> <b>${F.be10.toFixed(2)}%</b></span>
  <button class="theme" type="button" id="theme" aria-label="Switch light or dark"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button>`;
  $("#theme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
  $("#foot").innerHTML = `<div>Market data: U.S. Treasury daily par yield curves, nominal and real (TIPS), through ${dateLong(F.asof)}; FRED series T10YIE, T5YIE, DFF, CPIAUCSL, BAMLC0A0CM and BAMLH0A0HYM2; annual returns ${D.ret[0][0]} to ${D.ret[D.ret.length - 1][0]} from Aswath Damodaran, NYU Stern. Fetched ${F.fetched_at.slice(0, 10)}${D.__source === "omni" ? ", read from this workbook\u2019s ladder queries" : D.__source === "embedded-fallback" ? ", from the copy built into this app (the workbook\u2019s ladder queries did not answer)" : ""}.</div><div>The starting household is built from rounded U.S. averages until you change it. An educational model from Astrodata, not investment advice.</div>`;
}
let lastW = 0;
new ResizeObserver(() => { const w = SW(); if (Math.abs(w - lastW) > 8) { lastW = w; renderStage(); } }).observe($("#stage"));
addEventListener("hashchange", () => { const i = STEPS.findIndex(s => s.id === location.hash.slice(1)); if (i >= 0 && i !== st.step) go(i); });
(function boot() {
  const h = (location.hash || "").slice(1), i = STEPS.findIndex(s => s.id === h);
